# schema подставляет sdd component-init: impl-backend | impl-frontend
schema: __SCHEMA__

# Бизнес-спеки читаются из store (read-only). Правки бизнес-требований - только
# через change в store.
references:
  # по remote sdd setup клонирует store рядом и регистрирует его (и openspec doctor подскажет команду)
  - { id: __STORE_ID__, remote: "__STORE_REMOTE__" }

context: |
  Это репозиторий компонента "__COMPONENT__". Implementation-changes здесь
  описывают КАК (design.md, tasks.md) и ссылаются на бизнес-change в store через
  поле initiative в .openspec.yaml. Текст артефактов пиши на русском.
  Чисто технические изменения без изменения бизнес-поведения (рефакторинг,
  обновление зависимостей, инфраструктура) делаются схемой spec-driven
  с skip_specs: true, либо с локальными техническими спеками в openspec/specs.
  Правила проектирования и кода сервиса (слои, библиотеки, ошибки, транзакции,
  тесты) - в __CONTEXT_FILE__ в корне репозитория: design.md и код следуют им,
  отступление - только с обоснованием в design.md.

operations:
  apply:
    guidance:
      - Перед началом сверь design.md с актуальной версией upstream-change в store (git pull store)
      - В названии теста указывай <capability>/<scenario> из трассировки covers
  archive:
    guidance:
      - Перед archive запусти скил sdd-impl-verify
