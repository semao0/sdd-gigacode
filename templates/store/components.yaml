# Реестр компонентов продукта. Используется скилами sdd-*:
#  - id попадает в раздел "Компоненты" system.md (его пишет системный аналитик).
#  - description - за что отвечает компонент: по нему СА и скил решают, кого затрагивает фича.
#  - schema - схема implementation-change в репозитории компонента.
#  - repo - откуда клонировать; dir - имя каталога рядом со store в рабочей папке.
components:
  - id: backend
    description: серверная логика и API
    schema: impl-backend
    repo: git@gitlab.example.com:product/backend.git
    dir: backend
  - id: frontend
    description: пользовательский интерфейс
    schema: impl-frontend
    repo: git@gitlab.example.com:product/frontend.git
    dir: frontend
