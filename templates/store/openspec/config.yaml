schema: business

context: |
  Это STORE бизнес-спецификаций продукта. Единый источник правды о поведении
  продукта для всех компонентов (backend, frontend, mobile, ...).
  Текст артефактов пиши на русском; служебные заголовки OpenSpec
  (## ADDED Requirements, ### Requirement:, #### Scenario:, WHEN/THEN, SHALL/MUST)
  оставляй на английском - по ним работает парсер.
  Список компонентов и их репозиториев - в components.yaml в корне store.

rules:
  proposal:
    - Указывай ссылку на задачу в трекере в разделе Why
  specs:
    - Не упоминай технологии, эндпоинты, таблицы и UI-элементы конкретного фреймворка
