name: business
version: 1
description: Изменение в store - proposal → specs (бизнес-аналитик) → system (системный аналитик); design/tasks живут в репозиториях компонентов
apply: false
artifacts:
  proposal:
    description: Бизнес-обоснование и скоуп
    instruction_prefix: |
      КОРПОРАТИВНЫЙ КОНТЕКСТ. Это change в STORE (общем репозитории спек продукта).
      Автор proposal и specs - бизнес-аналитик: только ЧТО и ЗАЧЕМ для бизнеса.
      Разбиение на компоненты и контракты делает системный аналитик в system.md,
      design.md/tasks.md - команды компонентов в своих репозиториях.
      - Разделы шаблона "Для кого", "Вне скоупа", "Метрики успеха" обязательны.
      - Не распределяй поведение по компонентам (backend/frontend) - это решение СА.
      - Нельзя упоминать классы, таблицы, эндпоинты, фреймворки. Если без этого
        не сформулировать - это вопрос к design, а не к proposal.
      - Разделы "Открытые вопросы" и "Принятые решения" обязательны ("нет", если пусто).
        Решение в "Принятые решения" и в specs - только подтверждённое пользователем;
        твоё допущение - это открытый вопрос с вариантами, а не требование.
  specs:
    description: Бизнес-требования и сценарии (общие для фронта и бека)
    instruction_suffix: |
      КОРПОРАТИВНЫЕ ПРАВИЛА ДЛЯ БИЗНЕС-СПЕК:
      - Спека описывает наблюдаемое поведение продукта для пользователя или
        внешней системы. Она ОДНА на все компоненты: не дели требования на
        "фронтовые" и "бековые", не пиши "API возвращает..." или "кнопка вызывает...".
      - Пиши текст требований и сценариев на русском, но служебные заголовки и
        ключевые слова оставляй как есть: `## ADDED Requirements`, `### Requirement:`,
        `#### Scenario:`, `**WHEN**`/`**THEN**`/`**AND**`, SHALL/MUST.
      - Каждый сценарий должен быть проверяем: его название станет ID для
        трассировки в tasks.md и тестах компонентов (`covers: <capability>/<scenario>`).
        Поэтому названия сценариев уникальны внутри capability и не меняются без нужды.
      - Обязательно опиши негативные сценарии: ошибки, пустые состояния, права доступа.
      - Капабилити группируй по бизнес-доменам: `<domain>/<capability>`
        (например `checkout/promo-codes`), сверяясь с `openspec list --specs --store <id>`.
      - Capability - отдельная бизнес-возможность («корзина», «промокоды»), а не фича,
        экран или поле. Сначала ищи существующую capability и меняй её (MODIFIED);
        новую заводи, только если возможности ещё нет. Ориентир - 3-10 требований
        на capability; если больше, предложи разделить.
      - Домен `integration/` зарезервирован за системным аналитиком: там описывается
        поведение на границе компонентов и внешних систем (что отдаётся, как
        обрабатывается отказ). Бизнес-аналитик в него не пишет.
  system:
    define:
      generates: system.md
      description: Системные требования - компоненты, контракты интеграций, данные, НФТ (системный аналитик)
      template: system.md
      requires: [specs]
      instruction: |
        Создай system.md - системные требования к изменению. Автор - системный
        аналитик (СА). Это мост между бизнес-спекой (ЧТО) и design компонентов (КАК
        внутри компонента). system.md - ЕДИНЫЙ источник правды о том, как компоненты
        взаимодействуют; команды не меняют контракты в обход него.

        Перед записью:
        - прочитай proposal.md и все specs/ этого change;
        - прочитай components.yaml в корне store - допустимы только эти id компонентов;
        - прочитай system.md заархивированных changes по тем же capability
          (`openspec/changes/archive/*/system.md`), существующие спеки `integration/`
          и действующие контракты в `contracts/` в корне store,
          чтобы не противоречить действующим контрактам.

        Разделы (все обязательны; если раздел не применим - напиши "нет" и почему):
        - **Компоненты**: список `- \`<id>\`: <ответственность>` только для затронутых
          компонентов. По этому списку команды заводят impl-changes, а store проверяет
          готовность к archive. Формат строк не меняй - его читают скилы.
        - **Матрица сценариев**: таблица `capability/scenario | компоненты | примечание`.
          Каждый сценарий из specs/ этого change должен быть в таблице хотя бы с одним
          компонентом. Названия сценариев - точно как в specs (это ID трассировки).
        - **Взаимодействие**: последовательность вызовов/событий между компонентами и
          внешними системами для основных сценариев (mermaid sequenceDiagram).
        - **Контракты интеграций**: для каждого API/события - метод и путь или топик,
          поля запроса/ответа с типами и обязательностью, коды и тексты ошибок,
          идемпотентность, версионирование и обратная совместимость. Если контракт
          большой - положи OpenAPI/AsyncAPI в папку change: `contracts/<name>.openapi.yaml`
          (рядом с system.md) и сошлись на файл. Действующие контракты продукта лежат
          в `contracts/` в корне store: бери их за основу и копируй изменяемый файл
          в папку change целиком, а не только diff.
        - **Логическая модель данных**: сущности, атрибуты, связи, жизненный цикл
          статусов. Без таблиц и индексов - это решение backend.
        - **Нефункциональные требования**: нагрузка, время ответа, доступность,
          безопасность и права, аудит, персональные данные - с измеримыми значениями.
        - **Миграция и совместимость**: существующие данные, порядок выкатки
          компонентов, feature flags.
        - **Открытые вопросы**: к бизнесу и к командам компонентов, с пометкой
          `[блокирующий]` или `[неблокирующий]` и адресатом. Своё допущение - это
          вопрос с вариантами, а не решение.
        - **Принятые решения**: закрытые вопросы - ответ и кто подтвердил.

        Нельзя: классы, таблицы БД, фреймворки и внутреннее устройство компонента.
        Если поведение на границе компонентов требует проверяемых сценариев,
        добавь delta в `specs/integration/<capability>/spec.md` в формате OpenSpec
        (Requirement/Scenario) и включи эти сценарии в матрицу.
